name: battuta
description: "A music rehearsal & lead-sheet companion for worship teams and bands."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # --- Routing ---
  go_router: ^18.1.1

  # --- Data / Serialization ---
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # --- Functional Programming ---
  fpdart: ^1.1.0

  # --- Utilities ---
  uuid: ^4.5.1
  path_provider: ^2.1.5
  collection: ^1.19.1
  intl: ^0.20.2
  logger: ^2.5.0
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Code Generation ---
  build_runner: ^2.4.14
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9

  # --- Testing ---
  mocktail: ^1.0.4

  # --- Linting ---
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  # Fonts will be added when Bravura SMuFL is bundled (ticket #86e3yy422)
  # fonts:
  #   - family: Bravura
  #     fonts:
  #       - asset: assets/fonts/Bravura.otf
